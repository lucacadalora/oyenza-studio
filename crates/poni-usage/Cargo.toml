[package]
name = "poni-usage"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The AI tab's readers (poni_core::usage's files), built as their own crate so the release profile can build them for size."

# The readers stay where they are, in poni-core/src/usage/, and poni-core
# still compiles them for its own tests (`cargo test -p poni-core usage::`).
# The apps use this crate instead (`poni_usage::...`), which the workspace's
# release profile builds for size: they run for moments every few minutes,
# never in a frame (AGENTS.md, Keep it light).
[lib]
path = "../poni-core/src/usage/mod.rs"
test = false
doctest = false

[dependencies]
poni-core = { path = "../poni-core" }
serde.workspace = true
serde_json.workspace = true
