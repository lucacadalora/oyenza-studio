name: mac

# The Mac app: build it for Apple Silicon and Intel, draw every island state
# offscreen, run the real window through a few states with screenshots, and
# package an ad-hoc signed test DMG. Its own workflow, so it never holds up
# the Windows CI or a Windows release. A release tag also puts the DMG on the
# GitHub release, once ci has published it: signed with the Developer ID and
# notarized by Apple when the release environment holds the secrets
# (docs/mac-signing.md), the ad-hoc one until then.
on:
  push:
    branches: [main, "mac-*"]
    tags: ["v*"]
  # Every pull request into main too: a change to shared code (a new command,
  # event or page) can break the Mac build, and this shows it before it merges.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Also sign and notarize the DMG with the Developer ID (an artifact only; nothing is published)"
        type: boolean
        default: false

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mac:
    name: Build, render, smoke-run and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build -p poni --release --target aarch64-apple-darwin
          cargo build -p poni --release --target x86_64-apple-darwin

      - name: Unit tests (core)
        run: cargo test -p poni-core -p studio-usage --release

      # Every island state with sample data, Classic, Oyen, Glass (a
      # smoked stand-in for macOS's glass) and Pill, without and with a
      # MacBook's notch. The runner has no notch, so this is where the notch
      # layouts are looked at.
      - name: Render the island (offscreen)
        run: |
          bin=target/aarch64-apple-darwin/release/poni
          $bin --render mac-renders
          $bin --render mac-renders --theme oyen
          $bin --render mac-renders --theme glass
          $bin --render mac-renders --theme pill
          $bin --render mac-renders --notch
          $bin --render mac-renders --theme oyen --notch
          $bin --render mac-renders --theme glass --notch
          $bin --render mac-renders --theme pill --notch
          ls mac-renders | wc -l

      # What plays, from macOS's own now playing (browsers, Spotify, Music):
      # the MediaRemote adapter (third_party/mediaremote-adapter), its
      # framework for the app and its test player for the smoke runs. Its own
      # test says whether macOS's now playing answers on this runner.
      - name: MediaRemote adapter
        run: |
          cmake -S third_party/mediaremote-adapter -B build/mediaremote -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build/mediaremote --config Release -j 4
          lipo -info build/mediaremote/MediaRemoteAdapter.framework/MediaRemoteAdapter
          du -sk build/mediaremote/MediaRemoteAdapter.framework
          set +e
          /usr/bin/perl third_party/mediaremote-adapter/bin/mediaremote-adapter.pl "$PWD/build/mediaremote/MediaRemoteAdapter.framework" "$PWD/build/mediaremote/MediaRemoteAdapterTestClient" test
          echo "adapter test: exit $? (0 = macOS's now playing answers here)"

      - name: App icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          .icon-venv/bin/python tools/make_mac_icon.py build/OyenzaStudio.iconset
          iconutil -c icns build/OyenzaStudio.iconset -o build/OyenzaStudio.icns

      - name: App bundle and DMG
        run: |
          chmod +x tools/make_mac_app.sh
          MEDIAREMOTE_BUILD=build/mediaremote tools/make_mac_app.sh target/aarch64-apple-darwin/release/poni target/x86_64-apple-darwin/release/poni build/OyenzaStudio.icns dist

      # The real app on the runner's screen: idle, hover, open (Focus, then
      # Today with live stats), the timer, a notice, the volume and charging
      # pop-ups, files dropped on the Shelf, a Spotify "now playing"
      # notification with its lyrics looked up on LRCLIB, the Glass theme,
      # Pill floating below the top edge, Oyen, Glass and Pill around a notch
      # the app pretends the screen has, the adapter's test player in macOS's
      # own now playing, a tab playing in the runner's Edge (YouTube's way of
      # naming a song), the AI tab's keychain reads (test items of its own),
      # and the menu. At each state the app writes where its window is and
      # waits; tools/mac-smoke.sh takes the screenshot and answers.
      - name: Smoke run (the real window, with screenshots)
        env:
          MEDIAREMOTE_TEST_CLIENT: build/mediaremote/MediaRemoteAdapterTestClient
        run: bash tools/mac-smoke.sh "dist/Oyenza Studio.app/Contents/MacOS/poni"

      - name: Check the DMG
        run: |
          dmg=$(ls dist/*.dmg)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/poni-dmg
          ls -la /tmp/poni-dmg
          # What a PR costs on the Mac: the DMG, and the app's binary in it.
          ls -l "$dmg" "/tmp/poni-dmg/Oyenza Studio.app/Contents/MacOS/poni"
          plutil -p "/tmp/poni-dmg/Oyenza Studio.app/Contents/Info.plist"
          lipo -info "/tmp/poni-dmg/Oyenza Studio.app/Contents/MacOS/poni"
          codesign --verify --deep --strict "/tmp/poni-dmg/Oyenza Studio.app"
          spctl --assess --type execute -vv "/tmp/poni-dmg/Oyenza Studio.app" || echo "(expected: Gatekeeper turns down a build that isn't signed with a Developer ID yet)"
          hdiutil detach /tmp/poni-dmg

      # A Mac installs its own update (docs/updates.md): an installed copy
      # finds a newer version waiting (this build numbered 99.0.0, in a DMG
      # made like a release's), takes the app out, swaps it into its own
      # place, quits, and the new version opens.
      - name: Update in place (the app replaces itself)
        run: bash tools/mac-update-test.sh "dist/Oyenza Studio.app"

      - uses: actions/upload-artifact@v4
        with:
          name: oyenza-studio-mac-dmg
          path: dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mediaremote-test-client
          path: build/mediaremote/MediaRemoteAdapterTestClient
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-renders
          path: mac-renders/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: |
            smoke/*.png
            smoke/report.json
            smoke/stdout.txt
            smoke/home/poni.log

  # Liquid Glass came with macOS 26: the same DMG's smoke run on a macOS 26
  # runner, where the Glass steps show the real glass (the macOS 15 run
  # above shows the blur that stands in before it).
  tahoe:
    name: Smoke-run on macOS 26 (Liquid Glass)
    needs: mac
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oyenza-studio-mac-dmg
          path: dmg
      - uses: actions/download-artifact@v4
        with:
          name: mediaremote-test-client
          path: build/mediaremote
      - name: Smoke run (the real window, with screenshots)
        env:
          MEDIAREMOTE_TEST_CLIENT: build/mediaremote/MediaRemoteAdapterTestClient
        run: |
          chmod +x "$MEDIAREMOTE_TEST_CLIENT"
          sw_vers
          hdiutil attach dmg/*.dmg -nobrowse -readonly -mountpoint /tmp/poni-dmg
          mkdir -p dist
          cp -R "/tmp/poni-dmg/Oyenza Studio.app" dist/
          hdiutil detach /tmp/poni-dmg
          bash tools/mac-smoke.sh "dist/Oyenza Studio.app/Contents/MacOS/poni"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-tahoe
          path: |
            smoke/*.png
            smoke/report.json
            smoke/stdout.txt
            smoke/home/poni.log

  # The signing path on every run that isn't a release, with a throwaway
  # certificate: the app gets the hardened runtime and its entitlements, the
  # DMG is signed, and the signed app goes through the smoke run, so a change
  # that breaks under the hardened runtime shows before a release needs it.
  # Apple's notarization is the one step only the sign job below does.
  sign-check:
    name: Signing path check (throwaway certificate)
    if: "!startsWith(github.ref, 'refs/tags/v')"
    needs: mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oyenza-studio-mac-dmg
          path: dmg
      - name: A throwaway signing certificate in a temporary keychain
        run: |
          kc="$RUNNER_TEMP/sign-check.keychain-db"
          pw="$(openssl rand -hex 16)"
          cd "$RUNNER_TEMP"
          printf '%s\n' '[req]' 'distinguished_name = dn' 'prompt = no' 'x509_extensions = ext' \
            '[dn]' 'CN = Oyenza Studio CI throwaway signing' \
            '[ext]' 'basicConstraints = critical, CA:false' 'keyUsage = critical, digitalSignature' \
            'extendedKeyUsage = critical, codeSigning' > sign.cnf
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config sign.cnf -keyout sign.key -out sign.crt
          /usr/bin/openssl pkcs12 -export -inkey sign.key -in sign.crt -out sign.p12 -passout "pass:$pw"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import sign.p12 -k "$kc" -P "$pw" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc"
          # Trusted for code signing on this runner only, as a Developer ID is everywhere.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain sign.crt \
            || echo "(could not mark the throwaway certificate trusted)"
          rm -f sign.key sign.p12
          security find-identity -p codesigning "$kc"
          id=$(security find-identity -p codesigning "$kc" | awk '/Oyenza Studio CI throwaway signing/ {print $2; exit}')
          [ -n "$id" ] || exit 1
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Sign the app and the DMG (no notarization)
        run: NOTARIZE=0 SIGN_KEYCHAIN="$KEYCHAIN" bash tools/sign_mac_dmg.sh dmg/*.dmg signed "$IDENTITY"
      - uses: actions/download-artifact@v4
        with:
          name: mediaremote-test-client
          path: build/mediaremote
      - name: Smoke run, the app under the hardened runtime
        env:
          MEDIAREMOTE_TEST_CLIENT: build/mediaremote/MediaRemoteAdapterTestClient
        run: |
          chmod +x "$MEDIAREMOTE_TEST_CLIENT"
          hdiutil attach signed/*.dmg -nobrowse -readonly -mountpoint /tmp/poni-signed
          mkdir -p dist
          cp -R /tmp/poni-signed/*.app dist/
          hdiutil detach /tmp/poni-signed
          apps=(dist/*.app)
          app="${apps[0]}"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Authority|Timestamp|CodeDirectory)"
          bash tools/mac-smoke.sh "$app/Contents/MacOS/poni"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-hardened
          path: |
            smoke/*.png
            smoke/report.json
            smoke/stdout.txt
            smoke/home/poni.log

  # The release DMG, signed with the Developer ID, notarized by Apple and
  # stapled, so it opens with a plain "Open". Runs on release tags, and by hand
  # with "sign" on (gh workflow run mac.yml --ref main -f sign=true) to try a
  # signed DMG without releasing: it is then only an artifact. The secrets live
  # in the release environment (docs/mac-signing.md). Without them this job
  # says so and the release keeps the ad-hoc DMG.
  sign:
    name: Sign, notarize and staple the DMG (Developer ID)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
    needs: mac
    runs-on: macos-15
    environment: release
    outputs:
      signed: ${{ steps.dmg.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Developer ID secrets in the release environment?
        id: secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -n "$P12" ] && [ -n "$P8" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets in the release environment yet, so the DMG stays ad-hoc signed (docs/mac-signing.md)."
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          name: oyenza-studio-mac-dmg
          path: dmg
      - name: The Developer ID certificate in a temporary keychain
        if: steps.secrets.outputs.present == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          pw="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Apple's Developer ID G2 intermediate, so codesign can build the
          # chain even on a runner image that lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc"
          security find-identity -v -p codesigning "$kc"
          id=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$id" ]; then
            echo "::error::No valid Developer ID Application certificate in MACOS_CERTIFICATE_P12_BASE64 (docs/mac-signing.md)."
            exit 1
          fi
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        id: dmg
        if: steps.secrets.outputs.present == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          ( umask 077 && printf '%s\n' "$P8" > "$NOTARY_KEY" )
          SIGN_KEYCHAIN="$KEYCHAIN" bash tools/sign_mac_dmg.sh dmg/*.dmg signed "$IDENTITY"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # The signed DMG goes up as soon as it exists, so a run whose smoke run
      # fails still leaves it to look at. A release takes it only when this
      # whole job succeeds (needs.sign.result in the release job).
      - uses: actions/upload-artifact@v4
        if: steps.dmg.outputs.signed == 'true'
        with:
          name: oyenza-studio-mac-dmg-signed
          path: signed/*.dmg
      # The adapter's test player, as every other smoke run has it.
      - uses: actions/download-artifact@v4
        if: steps.dmg.outputs.signed == 'true'
        with:
          name: mediaremote-test-client
          path: build/mediaremote
      - name: Smoke run, the signed app
        if: steps.dmg.outputs.signed == 'true'
        env:
          MEDIAREMOTE_TEST_CLIENT: build/mediaremote/MediaRemoteAdapterTestClient
        run: |
          chmod +x "$MEDIAREMOTE_TEST_CLIENT"
          hdiutil attach signed/*.dmg -nobrowse -readonly -mountpoint /tmp/poni-signed
          mkdir -p dist
          cp -R /tmp/poni-signed/*.app dist/
          hdiutil detach /tmp/poni-signed
          apps=(dist/*.app)
          app="${apps[0]}"
          bash tools/mac-smoke.sh "$app/Contents/MacOS/poni"
      # The signed app's reader for macOS's now playing (browsers, any player),
      # tried the way the build job tries the unsigned framework: as signed in
      # the app, and as the copy the app made in its cache folder. It only
      # reports. 28 Oct 2026: that copy was the binary alone, which macOS
      # refuses once the signature is a Developer ID ("code signature invalid").
      - name: Now playing reader, with the signed framework
        if: always() && steps.dmg.outputs.signed == 'true'
        timeout-minutes: 3
        env:
          MEDIAREMOTE_TEST_CLIENT: build/mediaremote/MediaRemoteAdapterTestClient
        run: |
          apps=(dist/*.app)
          app="${apps[0]}"
          if [ ! -d "$app" ]; then echo "no signed app in dist/"; exit 0; fi
          chmod +x "$MEDIAREMOTE_TEST_CLIENT"
          fw="$PWD/$app/Contents/Frameworks/MediaRemoteAdapter.framework"
          # The copy the smoke run's app made itself, if it made one.
          own=$(find "$PWD/smoke/home" "$HOME/Library/Caches" -path "*mediaremote/MediaRemoteAdapter.framework" 2> /dev/null | head -1)
          echo "the app's own copy: ${own:-none}"
          codesign --display --verbose=2 "$fw" 2>&1 | grep -E "^(Identifier|Format|CodeDirectory|Authority|TeamIdentifier)" || true
          set +e
          for f in "$fw" ${own:+"$own"}; do
            # The script says only "Failed to load framework"; this says why.
            /usr/bin/perl -MDynaLoader -e 'DynaLoader::dl_load_file($ARGV[0], 0) or die "does not load: " . DynaLoader::dl_error() . "\n"; print "loads: $ARGV[0]\n"' "$f/MediaRemoteAdapter"
            /usr/bin/perl "$app/Contents/Resources/mediaremote-adapter.pl" "$f" "$PWD/$MEDIAREMOTE_TEST_CLIENT" test
            echo "adapter test, $f: exit $?"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.dmg.outputs.signed == 'true'
        with:
          name: mac-smoke-signed
          path: |
            smoke/*.png
            smoke/report.json
            smoke/stdout.txt
            smoke/home/poni.log
      - name: Remove the keychain and the key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

  # The Mac app on the release: Oyenza-Studio-<version>-mac.dmg, plus
  # Oyenza-Studio-Mac.dmg, the fixed name the README's and the website's Mac
  # buttons download from releases/latest, and Oyen-Poni-Mac.dmg, the fixed
  # name from before the rename (0.1.17 to the last 0.1.x), which links out there still
  # use. ci publishes the release once the Windows build, installer and install
  # test pass, so this waits for it. It
  # takes the sign job's DMG when there is one; when signing failed it still
  # adds the ad-hoc DMG, so the Mac buttons never break, and warns.
  release:
    name: Put the DMG on the GitHub release (tags v*)
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.mac.result == 'success' }}
    needs: [mac, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oyenza-studio-mac-dmg
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.sign.result == 'success' && needs.sign.outputs.signed == 'true'
        with:
          name: oyenza-studio-mac-dmg-signed
          path: signed
      - name: Use the signed DMG when there is one
        env:
          SIGN_RESULT: ${{ needs.sign.result }}
        run: |
          if ls signed/*.dmg > /dev/null 2>&1; then
            rm -f dist/*.dmg
            cp signed/*.dmg dist/
            echo "This release ships the signed, notarized DMG." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGN_RESULT" = failure ]; then
            echo "::warning::Signing failed, so this release ships the ad-hoc DMG. Fix it, then re-run the sign job and this one."
          else
            echo "This release ships the ad-hoc DMG (no Developer ID secrets yet)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait for the release, then add the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          src=$(ls dist/*.dmg | head -1)
          [ "$src" = "dist/Oyenza-Studio-${tag#v}-mac.dmg" ] || cp "$src" "dist/Oyenza-Studio-${tag#v}-mac.dmg"
          cp "$src" dist/Oyenza-Studio-Mac.dmg
          cp "$src" dist/Oyen-Poni-Mac.dmg
          for i in $(seq 1 90); do
            gh release view "$tag" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$tag" "dist/Oyenza-Studio-${tag#v}-mac.dmg" dist/Oyenza-Studio-Mac.dmg dist/Oyen-Poni-Mac.dmg --clobber
      # latest.json tells Macs about a release only once its DMG is there
      # (docs/updates.md): have the Website workflow write it again now.
      - name: Let the update file name the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main -f released="${GITHUB_REF_NAME#v}"
