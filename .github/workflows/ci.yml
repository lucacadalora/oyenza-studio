name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Cargo.toml's workspace version, installer/poni.nsi and installer/poni.iss.
  PONI_VERSION: "0.1.16"

jobs:
  core:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p poni-core
      # THIRD-PARTY-NOTICES.txt ships with every build: it must list every
      # crate poni.exe links (run the script after changing dependencies).
      - name: Third-party notices up to date
        run: |
          cargo fetch --locked
          python3 tools/make_notices.py --check

  windows:
    name: Build, self-test, smoke-run and package (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build -p poni --release

      - name: Unit tests
        run: cargo test --workspace --release

      - name: Self-test (scripted screenshots)
        shell: pwsh
        run: |
          # Park the cursor mid-screen so a hover can't change the scripted states.
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCi -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCi.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-out | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-out" -PassThru
          $null = $p.Handle  # keep the handle so ExitCode is available after exit
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Write-Host "self-test did not finish within 120 s"
            $code = -1
          } else {
            $code = $p.ExitCode
          }
          "selftest exit code: $code"

          "---- report.json"
          if (Test-Path selftest-out\report.json) { Get-Content selftest-out\report.json -Raw } else { "(missing)" }
          "---- screenshots"
          Get-ChildItem selftest-out -Filter *.png | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

          if ($code -ne 0) {
            "---- poni.log (tail)"
            Get-Content selftest-out\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      # The Oyen theme (cream look, embedded Outfit font) with the sample song in
      # Japanese: its pronunciation line comes from Windows' own reading
      # analyzer, which Wine doesn't have, so this is where it gets checked.
      # Every line must read (kanji lines too), from a worker thread like the
      # real lyrics lookup.
      - name: Self-test, Oyen theme, Japanese lyrics
        shell: pwsh
        env:
          PONI_SELFTEST_THEME: oyen
          PONI_SELFTEST_LYRICS: ja
          PONI_SELFTEST_ANALYZER: required
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiOyen -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiOyen.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-oyen-ja | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-oyen-ja" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "oyen + japanese self-test exit code: $code"
          if (Test-Path selftest-oyen-ja\report.json) {
            $r = Get-Content selftest-oyen-ja\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
          }
          "---- pronunciation (poni.log)"
          Select-String -Path selftest-oyen-ja\home\cache\poni.log -Pattern 'selftest: \[ja\]|fonts:|reading analyzer' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
          if ($code -ne 0) {
            Get-Content selftest-oyen-ja\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      # The same song the way a PC without Windows' Japanese reading data
      # reads it (most Windows 11 PCs outside Japan): with Oyen Poni's own
      # dictionary. Every line must read here too.
      - name: Self-test, Japanese lyrics with Oyen Poni's own dictionary
        shell: pwsh
        env:
          PONI_SELFTEST_THEME: oyen
          PONI_SELFTEST_LYRICS: ja
          PONI_SELFTEST_ANALYZER: "off"
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiOwn -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiOwn.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-ja-own | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-ja-own" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "own-dictionary self-test exit code: $code"
          if (Test-Path selftest-ja-own\report.json) {
            $r = Get-Content selftest-ja-own\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
          }
          "---- pronunciation (poni.log)"
          Select-String -Path selftest-ja-own\home\cache\poni.log -Pattern 'selftest: \[ja\]|reading' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
          if ($code -ne 0) {
            Get-Content selftest-ja-own\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      # The Glass theme over pages the self-test draws itself (no screen copy):
      # a light page in light mode, a dark page in dark mode, and the dark page
      # in light mode (small glass flips dark, the open island stays light).
      # The glass shader runs here (WARP); Wine on a dev box draws smoked glass.
      - name: Self-test, Glass theme
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiGlass -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiGlass.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          $env:PONI_SELFTEST_THEME = "glass"
          $failed = 0
          foreach ($run in "light", "dark", "flip") {
            $env:PONI_SELFTEST_GLASS = $run
            $dir = "selftest-glass-$run"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest",$dir -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
            "glass ($run) self-test exit code: $code"
            if (Test-Path "$dir\report.json") {
              $r = Get-Content "$dir\report.json" -Raw | ConvertFrom-Json
              "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
            }
            Select-String -Path "$dir\home\cache\poni.log" -Pattern 'glass:' -ErrorAction SilentlyContinue | Select-Object -First 6 | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              Get-Content "$dir\home\cache\poni.log" -Tail 60 -ErrorAction SilentlyContinue
              $failed = 1
            }
          }
          exit $failed

      - name: Smoke run (real desktop, hover, idle CPU/RAM)
        shell: pwsh
        run: ./tools/ci-smoke.ps1 -Exe target\release\poni.exe -Out smoke-out

      # Glass on a real desktop: with its screen copy running, screenshots
      # show what's under the island instead of the island.
      - name: Smoke run, Glass theme (left out of screenshots)
        shell: pwsh
        run: ./tools/ci-smoke-glass.ps1 -Exe target\release\poni.exe -Out smoke-glass

      # The GPU renderer is the default (runners draw with WARP). The software
      # renderer is its fallback (no DirectComposition, device loss): test it too.
      - name: Self-test and smoke run, software renderer
        shell: pwsh
        env:
          PONI_RENDERER: software
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiSoft -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiSoft.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-soft | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-soft" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "software self-test exit code: $code"
          if (Test-Path selftest-soft\report.json) {
            $r = Get-Content selftest-soft\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
          }
          if ($code -ne 0) {
            Get-Content selftest-soft\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }
          ./tools/ci-smoke.ps1 -Exe target\release\poni.exe -Out smoke-soft

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          & $iscc "/DAppVersion=$env:PONI_VERSION" installer\poni.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "dist\Oyen-Poni-Setup-$env:PONI_VERSION.exe" | Format-List Name, Length

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poni-screens
          path: |
            selftest-out
            selftest-oyen-ja
            selftest-ja-own
            selftest-glass-light
            selftest-glass-dark
            selftest-glass-flip
            smoke-glass
            smoke-out
            selftest-soft
            smoke-soft
          if-no-files-found: warn

      - name: Upload poni.exe
        uses: actions/upload-artifact@v4
        with:
          name: poni-exe
          path: target/release/poni.exe
          if-no-files-found: error

      - name: Upload the Inno Setup build (a check; releases ship the NSIS one)
        uses: actions/upload-artifact@v4
        with:
          name: poni-setup-inno
          path: dist/Oyen-Poni-Setup-${{ env.PONI_VERSION }}.exe
          if-no-files-found: error

  installer:
    name: NSIS installer and portable zip (what releases ship)
    needs: windows
    # Pinned: 24.04's nsis 3.09 has the amd64-unicode stubs poni.nsi needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poni-exe
          path: dist
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip > /dev/null
          makensis -V2 -DEXE="$PWD/dist/poni.exe" -DOUTDIR="$PWD/dist" installer/poni.nsi
          # Portable build inside its own folder, as tools/package.sh makes it.
          ( cd dist && mkdir Poni && cp poni.exe ../THIRD-PARTY-NOTICES.txt Poni/ && zip -qr "Oyen-Poni-$PONI_VERSION-portable.zip" Poni && rm -rf Poni )
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: oyen-poni-setup
          path: |
            dist/Oyen-Poni-Setup-${{ env.PONI_VERSION }}.exe
            dist/Oyen-Poni-${{ env.PONI_VERSION }}-portable.zip
          if-no-files-found: error

  install-test:
    name: Install over 0.1.1, check and uninstall (Windows)
    needs: installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oyen-poni-setup
          path: dist
      - name: Fetch the release to upgrade from
        shell: pwsh
        # 0.1.1 is the installer people have today; the check upgrades from it.
        run: Invoke-WebRequest -Uri "https://github.com/lucacadalora/poni/releases/download/v0.1.1/Poni-Setup-0.1.1.exe" -OutFile previous-setup.exe
      - name: Install, check, uninstall
        shell: pwsh
        run: ./tools/ci-installer.ps1 -Setup "dist\Oyen-Poni-Setup-$env:PONI_VERSION.exe" -Version $env:PONI_VERSION -Previous previous-setup.exe -Out installer-out
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-check
          path: installer-out
          if-no-files-found: warn

  release:
    name: GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows, installer, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches PONI_VERSION
        run: test "$GITHUB_REF_NAME" = "v$PONI_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: oyen-poni-setup
          path: dist
      - name: Copy the installer to a fixed name for the README's download link
        run: cp "dist/Oyen-Poni-Setup-$PONI_VERSION.exe" dist/Oyen-Poni-Setup.exe
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          name: Oyen Poni ${{ env.PONI_VERSION }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: false
          make_latest: "true"
          files: |
            dist/Oyen-Poni-Setup-${{ env.PONI_VERSION }}.exe
            dist/Oyen-Poni-Setup.exe
            dist/Oyen-Poni-${{ env.PONI_VERSION }}-portable.zip
          fail_on_unmatched_files: true

  # Every release updates the website too (AGENTS.md). If the page on main names
  # this version, start the Website workflow, which has held it until now;
  # otherwise open a "Landing page not updated" issue.
  site:
    name: Website shows the release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      # main, not the tag: the website is published from main.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Put the page live, or open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-site-check.sh release "$GITHUB_REF_NAME"
