[workspace]
resolver = "2"
members = ["crates/poni-core", "crates/poni"]

[workspace.package]
version = "0.1.7"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/lucacadalora/poni"
homepage = "https://github.com/lucacadalora/poni"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
