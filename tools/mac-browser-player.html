<!doctype html>
<!-- The Mac smoke run's browser tab (tools/mac-smoke.sh, step
     now-playing-browser): Edge or Chrome plays a minute of a quiet tone and
     names it the way YouTube names a video, through the Media Session API.
     The browser hands that to macOS's own now playing, where the island
     reads it. Never shipped. -->
<meta charset="utf-8">
<title>The 1975 - Robbers - YouTube</title>
<p id="s">starting</p>
<audio id="a" loop></audio>
<script>
// A WAV made here, so the page needs no file next to it. Chromium hands only
// media of 5 s or more to the system's media controls.
function wav(seconds) {
  const rate = 22050, n = rate * seconds, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 440 * i / rate) * 1200), true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
const a = document.getElementById("a"), s = document.getElementById("s");
const meta = () => { navigator.mediaSession.metadata = new MediaMetadata({ title: "Robbers", artist: "The 1975", album: "The 1975" }); };
a.src = wav(60);
meta();
a.play().then(() => { meta(); s.textContent = "playing"; }).catch((e) => { s.textContent = "blocked: " + e; });
</script>
